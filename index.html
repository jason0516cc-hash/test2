<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Zephyrax.evo</title>
  <link rel="icon" type="image/png" href="favicon.png" />

  <style>
    @font-face {
      font-family: 'UbuntuCustom';
      src: url('./public/fonts/ubuntu-bold.woff2') format('woff2');
      font-weight: 700;
      font-style: normal;
    }
  </style>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;700&display=swap" rel="stylesheet" />

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #1ea761;
      overflow: hidden;
      font-family: 'UbuntuCustom', 'Ubuntu', sans-serif;
      user-select: none;
    }

    canvas#c {
      display: block;
      position: fixed;
      inset: 0;
      z-index: 55;
      pointer-events: none;
    }

    #game-ui { position: relative; z-index: 10; }
    .ui-element { position: fixed; pointer-events: auto; }

    .tooltip {
      position: absolute;
      background: rgba(8, 12, 24, 0.95);
      border: 2px solid #ffffff;
      border-radius: 8px;
      padding: 12px;
      color: #ffffff;
      font-family: monospace;
      font-size: 12px;
      line-height: 1.4;
      max-width: 250px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.1s ease;
      z-index: 20;
    }
    .tooltip.visible { opacity: 1; }

    /* ── Home screen ── */
    #home-screen {
      position: fixed;
      inset: 0;
      z-index: 50;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding-bottom: 30vh;
      pointer-events: none;
    }

    /* background: biome floor + mobs (client/ui/homeBackground.js) */
    #bg-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    .home-content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: auto;
    }

    #flower-canvas {
      flex-shrink: 0;
      width: 90px;
      height: 90px;
      cursor: none;
    }

    .flower-col {
      position: absolute;
      right: calc(100% + 28px);
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .home-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    /* sub-column: title + label + input, all same width */
    .name-input-col {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      width: clamp(160px, 24vw, 280px);
      gap: 4px;
    }

    .game-title {
      font-family: 'UbuntuCustom', 'Ubuntu', sans-serif;
      font-weight: 700;
      font-size: clamp(26px, 4.4vw, 46px);
      color: #ffffff;
      letter-spacing: 1px;
      text-align: center;
      -webkit-text-stroke: 3px #000000;
      paint-order: stroke fill;
      text-shadow: none;
      line-height: 1.15;
      margin-bottom: 2px;
      white-space: nowrap;
    }

    .name-label {
      font-family: 'UbuntuCustom', 'Ubuntu', sans-serif;
      font-size: 13px;
      color: #ffffffcc;
      font-weight: 400;
      text-align: center;
      text-shadow: 0 1px 3px rgba(0,0,0,0.5);
      margin-bottom: -2px;
    }

    /* name + play on one row */
    .name-play-row {
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }

    #player-name-input {
      background: #ffffff;
      border: 3px solid #000000;
      border-radius: 4px;
      padding: 9px 16px;
      font-size: 15px;
      font-family: 'UbuntuCustom', 'Ubuntu', sans-serif;
      width: 100%;
      text-align: center;
      outline: none;
      color: #111;
      transition: border-color 0.15s;
    }
    #player-name-input:focus {
      border-color: #167a48;
      box-shadow: 0 0 0 3px rgba(30, 167, 97, 0.28);
    }

    #play-btn {
      background: #178a50;
      border: 2px solid #0f5e35;
      color: #ffffff;
      font-family: 'UbuntuCustom', 'Ubuntu', sans-serif;
      font-weight: 700;
      font-size: 18px;
      padding: 9px 22px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      white-space: nowrap;
    }
    #play-btn:hover  { background: #1daa60; transform: scale(1.04); }
    #play-btn:active { transform: scale(0.97); }

    /* ── Homescreen stat + level block (lives under flower) ── */
    .home-stats {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
    }
    .stat {
      font-family: 'UbuntuCustom', 'Ubuntu', sans-serif;
      font-size: 13px;
      font-weight: 700;
      text-shadow: 0 1px 4px rgba(0,0,0,0.7);
      white-space: nowrap;
      color: #ffffff;
    }
    .stat-label { color: rgba(255,255,255,0.55); font-weight: 400; margin-right: 2px; }
    .hp-val  { color: #ff7070; }
    .dmg-val { color: #ffcc66; }
    #home-level-line {
      font-family: 'UbuntuCustom', 'Ubuntu', sans-serif;
      font-size: 13px;
      font-weight: 700;
      color: #e2eb67;
      text-shadow: 0 1px 4px rgba(0,0,0,0.7);
      white-space: nowrap;
      margin-top: 4px;
    }
    #home-level-line .stat-label { color: rgba(255,255,255,0.55); font-weight: 400; }

    /* ── Home-screen level pill (hidden — replaced by inline stat) ── */
    #home-level-pill { display: none; }

    /* ── Transition canvas ── */
    #transition-canvas {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: none;
      pointer-events: none;
    }

    /* ── Death overlay ── */
    /* Dimming layer — purely visual, never blocks clicks, sits below the
       top-left button row (z-index 101) so settings/updatelog/discord/X stay
       clickable while the death screen is up. */
    #death-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(0, 0, 0, 0.34);
      opacity: 0;
      transition: opacity 0.30s ease;
      pointer-events: none;
    }

    /* Content layer (text + buttons) — sits above everything, including the
       top-left button row, and is the only part that captures clicks. */
    #death-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9000;
      transform: translateY(-110%);
      opacity: 0;
      transition: transform 0.38s cubic-bezier(0.22, 1, 0.36, 1),
                  opacity   0.30s ease;
      pointer-events: none; /* only the buttons/text inside opt back in */
    }

    /* Text sits at true screen center (both axes) */
    #death-cause {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: 'UbuntuCustom', 'Ubuntu', sans-serif;
      font-weight: 700;
      font-size: 18px;
      color: #ffffff;
      text-align: center;
      text-shadow: 0 2px 6px rgba(0,0,0,0.6);
      margin: 0;
      white-space: nowrap;
      pointer-events: none; /* label only, nothing to click */
    }
    #death-cause .death-cause-source { /* color set inline per-death via JS (rarity color) */ }

    /* Button stack sits below the centered text, a bit smaller than before */
    #death-button-stack {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, 0);
      margin-top: 34px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      pointer-events: auto; /* buttons stay clickable even though the overlay itself is click-through */
    }

    /* Rows sized so death-menu + death-close together match death-respawn's width */
    #death-respawn {
      background: #1ea761;
      border: 3px solid #000000;
      color: #ffffff;
      font-family: 'UbuntuCustom', 'Ubuntu', sans-serif;
      font-weight: 700;
      font-size: 15px;
      padding: 8px 0;
      width: 165px;
      border-radius: 7px;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      letter-spacing: 0.5px;
    }
    #death-respawn:hover  { background: #27c872; transform: scale(1.04); }
    #death-respawn:active { transform: scale(0.97); }

    #death-secondary-row {
      display: flex;
      flex-direction: row;
      gap: 5px;
      width: 165px;
    }

    #death-menu, #death-close {
      flex: 1 1 0;
      border: 2px solid #000000;
      color: #ffffff;
      font-family: 'UbuntuCustom', 'Ubuntu', sans-serif;
      font-weight: 700;
      font-size: 10px;
      padding: 5px 0;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }

    #death-menu {
      background: #2a6fe0;
    }
    #death-menu:hover  { background: #3d82f5; transform: scale(1.04); }
    #death-menu:active { transform: scale(0.97); }

    #death-close {
      background: #d6332c;
    }
    #death-close:hover  { background: #eb433c; transform: scale(1.04); }
    #death-close:active { transform: scale(0.97); }
  </style>
</head>
<body>

  <div id="home-screen">
    <canvas id="bg-canvas"></canvas>

    <div class="home-content">
      <!-- Flower guy on the left with stats below him -->
      <div class="flower-col">
        <canvas id="flower-canvas" width="90" height="90"></canvas>
        <div class="home-stats">
          <span class="stat"><span class="stat-label">HP:</span><span class="hp-val" id="stat-hp">100</span></span>
          <span class="stat"><span class="stat-label">DMG:</span><span class="dmg-val" id="stat-dmg">25</span></span>
          <div id="home-level-line"><span class="stat-label">Lvl:</span><span id="home-level-pill-text">1 (0 / 80)</span></div>
        </div>
      </div>

      <!-- Center: title, label, input row -->
      <div class="home-center">
        <div class="name-play-row">
          <div class="name-input-col">
            <h1 class="game-title">Zephyrax.evo</h1>
            <p class="name-label">This pretty flower is called...</p>
            <input
              type="text"
              id="player-name-input"
              maxlength="24"
              autocomplete="off"
              spellcheck="false"
            />
          </div>
          <button id="play-btn">Play</button>
        </div>

        <!-- ── Level pill removed — now lives under flower col ── -->
      </div>
    </div>
  </div>

  <canvas id="transition-canvas"></canvas>
  <div id="ui"></div>
  <div id="tooltip" class="ui-element tooltip"></div>
  <canvas id="c"></canvas>

  <!-- Death overlay: a non-interactive dim backdrop (below the top-left
       button row) plus the click-through content layer that holds the
       actual death text/buttons (above everything) -->
  <div id="death-backdrop"></div>
  <div id="death-overlay">
    <p id="death-cause"></p>
    <div id="death-button-stack">
      <button id="death-respawn">Respawn</button>
      <div id="death-secondary-row">
        <button id="death-menu">Menu</button>
        <button id="death-close">Close</button>
      </div>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>

</body>
</html>
